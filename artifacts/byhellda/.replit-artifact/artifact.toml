kind = "web"
previewPath = "/"
title = "byHellda"
version = "1.0.0"
id = "artifacts/byhellda"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20783

[services.development]
run = "pnpm --filter @workspace/byhellda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/byhellda", "run", "build" ]
serve = "static"
publicDir = "artifacts/byhellda/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20783"
BASE_PATH = "/"
